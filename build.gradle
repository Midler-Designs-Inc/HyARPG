plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'com.example.hyarpg'
version = '3.5.0'

repositories {
    mavenCentral()
    // Official Hytale Maven repository
    maven {
        name = 'hytale-release'
        url = 'https://maven.hytale.com/release'
    }
    maven {
        name = 'hytale-pre-release'
        url = 'https://maven.hytale.com/pre-release'
    }
    maven {
        url "https://www.cursemaven.com"
    }
}

dependencies {
    // Hytale Server API from official Maven repository
    compileOnly 'com.hypixel.hytale:Server:0.5.0-pre.8'
    // JSR305 annotations (@Nonnull, @Nullable)
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'de.bsommerfeld.jshepherd:core:4.0.2'
    implementation 'de.bsommerfeld.jshepherd:toml:4.0.2'
    implementation "curse.maven:multiplehud-1423634:7840485"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

shadowJar {
    archiveClassifier.set('')
    // Exclude server classes from the final JAR
    dependencies {
        exclude(dependency { it.moduleGroup == 'com.hypixel' })
    }
}

// Disable the default jar task to avoid conflicts with shadowJar
tasks.named('jar') {
    enabled = false
    finalizedBy("deployToServer")
}

tasks.named('build') {
    dependsOn shadowJar
}

// Deploy plugin JAR to server mods folder
tasks.register('deployToServer', Copy) {
    from shadowJar
    into 'C:\\Users\\jeffm\\AppData\\Roaming\\Hytale\\UserData\\Mods'
    doLast {
        copy {
            from shadowJar
            into 'C:\\Users\\jeffm\\AppData\\Roaming\\Hytale\\data\\pre-release\\Mods'
        }
        println "Deployed to release and pre-release"
    }
}

// Watch for changes and auto-rebuild (useful during development)
tasks.register('watch') {
    doLast {
        println "Watching for changes... Press Ctrl+C to stop."
        println "Run 'gradle build --continuous' for auto-rebuild on file changes."
    }
}